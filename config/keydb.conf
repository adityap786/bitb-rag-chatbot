# KeyDB Configuration for BiTB RAG App (Development)
# Windows optimized settings

# Network
bind 127.0.0.1
port 6379
tcp-backlog 511

# Multi-threading (KeyDB's advantage)
server-threads 4                    # Match your CPU cores (4-8 recommended)
server-thread-affinity true         # Pin threads to CPU cores

# Memory
maxmemory 4gb                       # Adjust based on your RAM
maxmemory-policy allkeys-lru        # Evict least recently used keys

# Persistence (Disabled for dev performance)
save ""                             # Disable RDB snapshots
appendonly no                       # Disable AOF for speed

# Performance tuning
timeout 0                           # No client timeout
tcp-keepalive 300
hz 10                              # Internal timing frequency

# Logging
loglevel notice
logfile ""                         # Log to stdout

# Security (local dev only)
# protected-mode yes
requirepass ""                     # No password for local dev

# Database
databases 16

# Advanced
lazyfree-lazy-eviction yes         # Async memory reclamation
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Disable features not needed
activerehashing yes
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Notes:
# - For production: enable 'appendonly yes' and configure 'save' directive
# - Increase 'maxmemory' if you have more RAM available
# - Adjust 'server-threads' to match your CPU core count
